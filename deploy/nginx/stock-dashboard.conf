# Stock Research dashboard reverse proxy.
# Install into /etc/nginx/conf.d/stock-dashboard.conf or the equivalent site file.

server {
    server_name stock.manqiaotechnology.com;
    root /var/www/stock-dashboard/current;
    index index.html;

    auth_basic "Stock Research";
    auth_basic_user_file /etc/nginx/.htpasswd_stock;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
