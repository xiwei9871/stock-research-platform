[project]
name = "stock-research"
version = "0.1.0"
description = "AI monitoring and stock-selection research pipeline"
requires-python = ">=3.11"
dependencies = [
  "akshare",
  "baostock",
  "pandas",
  "PySocks",
  "psycopg[binary]",
  "pypdf",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "fastapi",
  "uvicorn",
  "httpx2",
]
dashboard = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
stock-research = "stock_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
